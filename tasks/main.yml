---
- name: Run single-mode stack generation
  include_tasks: generate-stack.yml
  vars:
    stack_search_path: >-
      {{ services_directory }}{{ docker_compose_hostname | default(inventory_hostname) }}
    stack_output_path: "{{ docker_compose_generator_output_path }}"
  when: docker_compose_generator_output_mode == 'single'

- name: Ensure top-level output directory exists (stack mode)
  file:
    path: "{{ docker_compose_generator_output_path }}"
    state: directory
    owner: "{{ docker_compose_generator_uid }}"
    group: "{{ docker_compose_generator_gid }}"
  when: docker_compose_generator_output_mode == 'stack'

- name: Find stack directories (stack mode)
  find:
    paths: >-
      {{ services_directory }}{{ docker_compose_hostname | default(inventory_hostname) }}
    file_type: directory
  delegate_to: localhost
  become: false
  register: stack_dirs_raw
  when: docker_compose_generator_output_mode == 'stack'

- name: Filter out config-* directories from stack list
  set_fact:
    stack_dirs: >-
      {{
        stack_dirs_raw.files |
        rejectattr('path', 'regex', '/config-[^/]+$') |
        list
      }}
  when: docker_compose_generator_output_mode == 'stack'

- name: Run per-stack generation (stack mode)
  include_tasks: generate-stack.yml
  vars:
    stack_search_path: "{{ stack_dir.path }}"
    stack_output_path: >-
      {{ docker_compose_generator_output_path }}/{{ stack_dir.path | basename }}
  loop: "{{ stack_dirs }}"
  loop_control:
    loop_var: stack_dir
    label: "{{ stack_dir.path | basename }}"
  when: docker_compose_generator_output_mode == 'stack'
