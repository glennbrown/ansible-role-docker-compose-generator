---
- name: Gather user facts (required for default uid/gid/path resolution)
  setup:
    gather_subset: ["!all", "user"]
  when: ansible_facts.user_uid is not defined

- name: Ensure top-level output directory exists
  file:
    path: "{{ docker_compose_generator_output_path }}"
    state: directory
    owner: "{{ docker_compose_generator_uid }}"
    group: "{{ docker_compose_generator_gid }}"

- name: Find stack directories
  find:
    paths: >-
      {{ services_directory }}{{ docker_compose_hostname | default(inventory_hostname) }}
    file_type: directory
  delegate_to: localhost
  become: false
  register: stack_dirs_raw

- name: Filter out config-* directories from stack list
  set_fact:
    stack_dirs: >-
      {{
        stack_dirs_raw.files |
        rejectattr('path', 'regex', '/config-[^/]+$') |
        list
      }}

- name: Run per-stack generation
  include_tasks: generate-stack.yml
  vars:
    stack_search_path: "{{ stack_dir.path }}"
    stack_output_path: >-
      {{ docker_compose_generator_output_path }}/{{ stack_dir.path | basename }}
  loop: "{{ stack_dirs }}"
  loop_control:
    loop_var: stack_dir
    label: "{{ stack_dir.path | basename }}"
