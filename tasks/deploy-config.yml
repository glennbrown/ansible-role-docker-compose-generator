---
- name: Check if .dest file exists for {{ config_dir.path | basename }}
  stat:
    path: "{{ config_dir.path }}/.dest"
  delegate_to: localhost
  become: false
  register: dest_file_stat

- name: Read .dest file for {{ config_dir.path | basename }}
  set_fact:
    _config_dest_raw: "{{ lookup('template', config_dir.path + '/.dest') | trim }}"
  when: dest_file_stat.stat.exists

- name: Resolve .dest path for {{ config_dir.path | basename }}
  set_fact:
    config_dest: >-
      {{ (stack_output_path + '/' + _config_dest_raw[2:]) if _config_dest_raw.startswith('./') else _config_dest_raw }}
  when: dest_file_stat.stat.exists

- name: Set default destination for {{ config_dir.path | basename }}
  set_fact:
    config_dest: >-
      {{ stack_output_path }}/config{%
        if stack_config_dirs.files | length > 1
      %}/{{ config_dir.path | basename | regex_replace('^config-', '') }}{%
        endif
      %}
  when: not dest_file_stat.stat.exists

- name: Get parent ZFS dataset for {{ config_dir.path | basename }}
  shell: "df --output=source {{ config_dest | dirname }} | tail -1"
  register: parent_dataset
  when: docker_compose_generator_zfs_enabled | default(false)
  changed_when: false

- name: Create ZFS dataset for {{ config_dir.path | basename }}
  community.general.zfs:
    name: "{{ parent_dataset.stdout }}/{{ config_dest | basename }}"
    state: present
  when:
    - docker_compose_generator_zfs_enabled | default(false)
    - parent_dataset.stdout is defined
    - parent_dataset.stdout | trim | length > 0
  become: true

- name: Ensure destination directory exists
  file:
    path: "{{ config_dest }}"
    state: directory
    owner: "{{ docker_compose_generator_uid }}"
    group: "{{ docker_compose_generator_gid }}"

- name: Find config files to deploy (excluding .dest, recursive)
  find:
    paths: "{{ config_dir.path }}"
    excludes: ".dest"
    file_type: file
    recurse: yes
  delegate_to: localhost
  become: false
  register: config_files

- name: Ensure parent directories exist for nested config files
  file:
    path: "{{ config_dest }}/{{ (item.path | replace(config_dir.path + '/', '')) | dirname }}"
    state: directory
    owner: "{{ docker_compose_generator_uid }}"
    group: "{{ docker_compose_generator_gid }}"
  loop: "{{ config_files.files }}"
  when: (item.path | replace(config_dir.path + '/', '')) | dirname | length > 0

- name: Template config files to destination
  template:
    src: "{{ item.path }}"
    dest: "{{ config_dest }}/{{ item.path | replace(config_dir.path + '/', '') }}"
    owner: "{{ docker_compose_generator_uid }}"
    group: "{{ docker_compose_generator_gid }}"
  loop: "{{ config_files.files }}"
