---
docker_compose_generator_output_path: >-
  {{ ('~' + ansible_env.SUDO_USER) if 'SUDO_USER' in ansible_env else ansible_facts['user_dir'] }}/docker
docker_compose_generator_uid: >-
  {{ ansible_env.SUDO_UID if 'SUDO_UID' in ansible_env else ansible_facts['user_uid'] }}
docker_compose_generator_gid: >-
  {{ ansible_env.SUDO_GID if 'SUDO_GID' in ansible_env else ansible_facts['user_gid'] }}
services_directory: "{{ playbook_dir }}/services/"
