---
docker_compose_generator_output_path: >-
  {{ ('~' + ansible_facts.env.SUDO_USER) if 'SUDO_USER' in ansible_facts.env else ansible_facts.user_dir }}/docker
docker_compose_generator_uid: >-
  {{ ansible_facts.env.SUDO_UID if 'SUDO_UID' in ansible_facts.env else ansible_facts.user_uid }}
docker_compose_generator_gid: >-
  {{ ansible_facts.env.SUDO_GID if 'SUDO_GID' in ansible_facts.env else ansible_facts.user_gid }}
services_directory: "{{ playbook_dir }}/services/"
